<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="StepUnder">
  <title>StepUnder</title>
  <defs>
    <linearGradient id="su-bg" x1="96" y1="0" x2="928" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#341963"/>
      <stop offset="0.55" stop-color="#180b33"/>
      <stop offset="1" stop-color="#0b0518"/>
    </linearGradient>
    <radialGradient id="su-glow" cx="0" cy="0" r="1" gradientTransform="translate(352 224) rotate(54) scale(700)">
      <stop offset="0" stop-color="#a855f7" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="su-bar" x1="512" y1="284" x2="512" y2="624" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f3efff"/>
    </linearGradient>
    <linearGradient id="su-under" x1="236" y1="652" x2="788" y2="652" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#d8b4fe"/>
      <stop offset="0.5" stop-color="#a855f7"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>

  <rect width="1024" height="1024" rx="224" fill="url(#su-bg)"/>
  <rect width="1024" height="1024" rx="224" fill="url(#su-glow)"/>
  <rect x="5" y="5" width="1014" height="1014" rx="219" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="10"/>

  <!-- Stepped equaliser: each bar is one step down -->
  <g fill="url(#su-bar)">
    <rect x="250" y="284" width="92" height="340" rx="46"/>
    <rect x="394" y="356" width="92" height="268" rx="46"/>
    <rect x="538" y="428" width="92" height="196" rx="46"/>
    <rect x="682" y="500" width="92" height="124" rx="46" opacity="0.94"/>
  </g>

  <!-- The "under" line: a soft wave carrying the steps -->
  <path d="M236 652Q512 768 788 652" fill="none" stroke="url(#su-under)" stroke-width="60" stroke-linecap="round"/>
</svg>
