name: Release

# Push a tag like v0.2.0 to build, sign and publish a release. tauri-action
# uploads latest.json next to the installer, which is the feed the in-app
# updater reads (see plugins.updater in src-tauri/tauri.conf.json).
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Verify version matches tag
        shell: bash
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          tag="${GITHUB_REF_NAME#v}"
          if [[ "$version" != "$tag" ]]; then
            echo "::error::src-tauri/tauri.conf.json is $version but the tag is $tag. Run 'bun run version:set $tag' first."
            exit 1
          fi

      - name: Verify signing key is configured
        shell: bash
        env:
          SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [[ -z "$SIGNING_KEY" ]]; then
            echo "::error::Add the updater private key as the TAURI_SIGNING_PRIVATE_KEY repository secret."
            exit 1
          fi

      - name: Fetch libmpv
        run: bun run mpv:fetch
        env:
          # Raises the GitHub API rate limit when resolving the mpv release.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "StepUnder ${{ github.ref_name }}"
          releaseBody: |
            Download the installer below, or let an existing StepUnder install
            update itself from **Settings → Updates**.
          # Stay a draft until latest.json is uploaded; otherwise
          # releases/latest points here before the feed exists and installed
          # apps fail with "Could not fetch a valid release JSON".
          releaseDraft: true
          prerelease: false
          tauriScript: bun run tauri
          # NSIS keeps the updater feed unambiguous: one installer, one signature.
          updaterJsonPreferNsis: true
          args: --bundles nsis

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          feed="$RUNNER_TEMP/feed"
          mkdir -p "$feed"
          gh release download "$GITHUB_REF_NAME" --pattern latest.json --dir "$feed" --clobber \
            || { echo "::error::latest.json was not uploaded; leaving the release as a draft."; exit 1; }
          # A re-run can find a stale feed from an earlier attempt on this tag.
          # Pass the path as an argument: RUNNER_TEMP is a Windows path, and its
          # backslashes would be eaten as escapes inside a JS string literal.
          version=$(node -p "JSON.parse(require('fs').readFileSync(process.argv[1], 'utf8')).version.replace(/^v/, '')" "$feed/latest.json")
          if [[ "$version" != "${GITHUB_REF_NAME#v}" ]]; then
            echo "::error::latest.json is for $version, not $GITHUB_REF_NAME; leaving the release as a draft."
            exit 1
          fi
          # Draft assets live under releases/download/untagged-*/ until the
          # release is published; point the feed at the tag so its URLs survive.
          if grep -q '/download/untagged-' "$feed/latest.json"; then
            sed -i -E "s#/download/untagged-[^/]+/#/download/$GITHUB_REF_NAME/#g" "$feed/latest.json"
            gh release upload "$GITHUB_REF_NAME" "$feed/latest.json" --clobber
          fi
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
