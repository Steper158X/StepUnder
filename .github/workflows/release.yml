name: Release

# Push a tag like v0.2.0 to build, sign and publish a release for Windows and
# Linux. The publish job writes latest.json, the feed the in-app updater reads
# (see plugins.updater in src-tauri/tauri.conf.json), once both builds exist.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.release.outputs.id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Verify version matches tag
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          tag="${GITHUB_REF_NAME#v}"
          if [[ "$version" != "$tag" ]]; then
            echo "::error::src-tauri/tauri.conf.json is $version but the tag is $tag. Run 'bun run version:set $tag' first."
            exit 1
          fi

      - name: Verify signing key is configured
        env:
          SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [[ -z "$SIGNING_KEY" ]]; then
            echo "::error::Add the updater private key as the TAURI_SIGNING_PRIVATE_KEY repository secret."
            exit 1
          fi

      # Notes for a release live in .github/release-notes/<tag>.md. They become
      # the release body and the notes the in-app updater shows.
      - name: Create draft release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          notes=".github/release-notes/$GITHUB_REF_NAME.md"
          if [[ ! -f "$notes" ]]; then
            notes="$RUNNER_TEMP/notes.md"
            printf '%s\n' "Download the installer below, or let an existing StepUnder install" \
              "update itself from **Settings → Updates**." > "$notes"
          fi
          # A re-run reuses the draft an earlier attempt created.
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
            --jq ".[] | select(.tag_name == \"$GITHUB_REF_NAME\") | .id" | head -n1)
          if [[ -z "$id" ]]; then
            gh release create "$GITHUB_REF_NAME" --draft --verify-tag \
              --title "StepUnder $GITHUB_REF_NAME" --notes-file "$notes"
            id=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
              --jq ".[] | select(.tag_name == \"$GITHUB_REF_NAME\") | .id" | head -n1)
          fi
          echo "id=$id" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis
          # 22.04 keeps glibc old enough for Ubuntu 22.04+ and Pop!_OS 22.04+.
          - os: ubuntu-22.04
            bundles: deb,appimage
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libssl-dev libdbus-1-dev pkg-config patchelf file \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-libav

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.os }}

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      # Windows bundles libmpv-2.dll; Linux uses the system libmpv instead.
      - name: Fetch libmpv
        if: runner.os == 'Windows'
        run: bun run mpv:fetch
        env:
          # Raises the GitHub API rate limit when resolving the mpv release.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and upload
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.prepare.outputs.release_id }}
          tauriScript: bun run tauri
          # The publish job writes one feed for every platform.
          uploadUpdaterJson: false
          args: --bundles ${{ matrix.bundles }}

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Write updater feed and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sigs="$RUNNER_TEMP/sigs"
          mkdir -p "$sigs"
          gh release download "$GITHUB_REF_NAME" --pattern '*.sig' --dir "$sigs" --clobber \
            || { echo "::error::No signatures were uploaded; leaving the release as a draft."; exit 1; }
          node scripts/make-updater-feed.mjs "$GITHUB_REF_NAME" "$GITHUB_REPOSITORY" \
            "$sigs" "$RUNNER_TEMP/latest.json" ".github/release-notes/$GITHUB_REF_NAME.md"
          gh release upload "$GITHUB_REF_NAME" "$RUNNER_TEMP/latest.json" --clobber
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
