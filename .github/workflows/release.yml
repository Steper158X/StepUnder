name: Release

# Push a tag like v0.2.0 to build, sign and publish a release for Windows,
# Linux and Android. The publish job writes latest.json, the feed the in-app updater reads
# (see plugins.updater in src-tauri/tauri.conf.json), once both builds exist.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.release.outputs.id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Verify version matches tag
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          tag="${GITHUB_REF_NAME#v}"
          if [[ "$version" != "$tag" ]]; then
            echo "::error::src-tauri/tauri.conf.json is $version but the tag is $tag. Run 'bun run version:set $tag' first."
            exit 1
          fi

      - name: Verify signing key is configured
        env:
          SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [[ -z "$SIGNING_KEY" ]]; then
            echo "::error::Add the updater private key as the TAURI_SIGNING_PRIVATE_KEY repository secret."
            exit 1
          fi

      # Notes for a release live in .github/release-notes/<tag>.md. They become
      # the release body and the notes the in-app updater shows.
      - name: Create draft release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          notes=".github/release-notes/$GITHUB_REF_NAME.md"
          if [[ ! -f "$notes" ]]; then
            notes="$RUNNER_TEMP/notes.md"
            printf '%s\n' "Download the installer below, or let an existing StepUnder install" \
              "update itself from **Settings → Updates**." > "$notes"
          fi
          # A re-run reuses the draft an earlier attempt created.
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
            --jq ".[] | select(.tag_name == \"$GITHUB_REF_NAME\") | .id" | head -n1)
          # Take the id from the create response: a new draft can take a while
          # to show up in the release list, which left the id empty before.
          if [[ -z "$id" ]]; then
            id=$(gh api -X POST "repos/$GITHUB_REPOSITORY/releases" \
              -f tag_name="$GITHUB_REF_NAME" -f name="StepUnder $GITHUB_REF_NAME" \
              -F draft=true -F body=@"$notes" --jq .id)
          fi
          if [[ -z "$id" ]]; then
            echo "::error::Could not create or find the draft release."
            exit 1
          fi
          echo "Draft release id: $id"
          echo "id=$id" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis
          # 22.04 keeps glibc old enough for Ubuntu 22.04+ and Pop!_OS 22.04+.
          - os: ubuntu-22.04
            bundles: deb,appimage
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libssl-dev libdbus-1-dev pkg-config patchelf file \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-libav

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.os }}

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      # Windows bundles libmpv-2.dll; Linux uses the system libmpv instead.
      - name: Fetch libmpv
        if: runner.os == 'Windows'
        run: bun run mpv:fetch
        env:
          # Raises the GitHub API rate limit when resolving the mpv release.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and upload
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.prepare.outputs.release_id }}
          tauriScript: bun run tauri
          # The publish job writes one feed for every platform.
          includeUpdaterJson: false
          args: --bundles ${{ matrix.bundles }}

  # Signed universal APK, attached to the same release. Android updates by
  # installing the new APK; it is not part of latest.json.
  android:
    needs: prepare
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - name: Check signing secrets
        id: secrets
        run: |
          if [[ -z "$KEYSTORE_BASE64" ]]; then
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set; skipping the Android build."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.secrets.outputs.ready == 'true'
        uses: actions/checkout@v5

      - name: Setup Java
        if: steps.secrets.outputs.ready == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # The runner image ships the Android SDK and NDK; Gradle fetches the
      # platform it needs.
      - name: Use preinstalled NDK
        if: steps.secrets.outputs.ready == 'true'
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "NDK: $ANDROID_NDK_LATEST_HOME"
          echo "NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"

      - name: Setup Bun
        if: steps.secrets.outputs.ready == 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust
        if: steps.secrets.outputs.ready == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Cache Rust build
        if: steps.secrets.outputs.ready == 'true'
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: android

      - name: Install frontend dependencies
        if: steps.secrets.outputs.ready == 'true'
        run: bun install --frozen-lockfile

      - name: Write keystore
        if: steps.secrets.outputs.ready == 'true'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          dir=src-tauri/gen/android
          echo "$KEYSTORE_BASE64" | base64 -d > "$dir/release.jks"
          {
            echo "storeFile=release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
          } > "$dir/keystore.properties"

      - name: Build APK
        if: steps.secrets.outputs.ready == 'true'
        run: bun run tauri android build --apk

      - name: Upload APK
        if: steps.secrets.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
        run: |
          set -euo pipefail
          apk=$(ls src-tauri/gen/android/app/build/outputs/apk/universal/release/*.apk | head -n1)
          name="StepUnder_${GITHUB_REF_NAME#v}_android.apk"
          api="repos/$GITHUB_REPOSITORY/releases"
          # Replace an APK an earlier attempt uploaded.
          gh api "$api/$RELEASE_ID/assets" --paginate --jq ".[] | select(.name == \"$name\") | .id" |
            while read -r id; do gh api -X DELETE "$api/assets/$id"; done
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
            -H "Content-Type: application/vnd.android.package-archive" \
            --data-binary "@$apk" \
            "https://uploads.github.com/$api/$RELEASE_ID/assets?name=$name" > /dev/null
          echo "Uploaded $name"

  publish:
    needs: [prepare, build, android]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Works on the draft by the id prepare created, the same id the builds
      # uploaded to. Looking a draft up by its tag is unreliable on GitHub.
      - name: Write updater feed and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
        run: |
          set -euo pipefail
          api="repos/$GITHUB_REPOSITORY/releases"
          auth=(-H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28")
          assets="$RUNNER_TEMP/assets.tsv"
          gh api "$api/$RELEASE_ID/assets" --paginate \
            --jq '.[] | "\(.id)\t\(.name)"' > "$assets"
          echo "Assets on release $RELEASE_ID:"; cut -f2 "$assets"

          sigs="$RUNNER_TEMP/sigs"
          mkdir -p "$sigs"
          while IFS=$'\t' read -r id name; do
            [[ "$name" == *.sig ]] || continue
            curl -fsSL "${auth[@]}" -H "Accept: application/octet-stream" \
              "https://api.github.com/$api/assets/$id" -o "$sigs/$name"
          done < "$assets"
          if ! ls "$sigs"/*.sig > /dev/null 2>&1; then
            echo "::error::No signatures were uploaded; leaving the release as a draft."
            exit 1
          fi

          node scripts/make-updater-feed.mjs "$GITHUB_REF_NAME" "$GITHUB_REPOSITORY" \
            "$sigs" "$RUNNER_TEMP/latest.json" ".github/release-notes/$GITHUB_REF_NAME.md"

          # Replace any latest.json an earlier attempt uploaded.
          while IFS=$'\t' read -r id name; do
            if [[ "$name" == "latest.json" ]]; then gh api -X DELETE "$api/assets/$id"; fi
          done < "$assets"
          curl -fsSL "${auth[@]}" -H "Content-Type: application/json" \
            --data-binary "@$RUNNER_TEMP/latest.json" \
            "https://uploads.github.com/$api/$RELEASE_ID/assets?name=latest.json" > /dev/null

          gh api -X PATCH "$api/$RELEASE_ID" -F draft=false -f make_latest=true > /dev/null
          echo "Published $GITHUB_REF_NAME"
